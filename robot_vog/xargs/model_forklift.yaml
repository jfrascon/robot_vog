# All xacro argument values in this file are stored as strings.
# This includes numbers, booleans and any other scalar values.

# Xacro arguments defined by urdf/includes/common.xacro.
# These fields configure the common VOG platform shared by every public model.
sim_file:
  default_value: ""
  description: "Path to the simulation YAML. If empty, the model default is used."

body_color:
  default_value: "0.5 0.5 0.5 1.0"
  description: "Body color as 'r g b a'."
body_use_inertial:
  default_value: "True"
  description: "Use inertial element for the body. If False, a null inertia is used."
  choices: ["True", "true", "False", "false"]

s_wheel_use_v_mesh:
  default_value: "True"
  description: "Use the built-in wheel visual mesh. If False, use the wheel primitive cylinder."
  choices: ["True", "true", "False", "false"]
s_wheel_color:
  default_value: "0.1 0.1 0.1 1.0"
  description: "Wheel color as 'r g b a'. Empty keeps mesh color."
s_wheel_use_inertial:
  default_value: "True"
  description: "Use inertial element for wheels. If False, a null inertia is used."
  choices: ["True", "true", "False", "false"]
s_wheel_steering_joint_limits:
  default_value: "-3.1416 3.1416 100.0 100000.0"
  description: "Steering joint limits as 'lower upper velocity effort'."
s_wheel_rotation_joint_limits:
  default_value: "100.0 100000.0"
  description: "Wheel rotation joint limits as 'velocity effort'."
s_wheel_max_contacts:
  default_value: "1"
  description: "Maximum number of contact points for each wheel."
s_wheel_mu:
  default_value: "0.05"
  description: "Primary friction coefficient for wheel-ground contact."
s_wheel_mu2:
  default_value: "0.5"
  description: "Secondary friction coefficient for wheel-ground contact."
s_wheel_slip1:
  default_value: "0.005"
  description: "Primary slip compliance for wheel-ground contact."
s_wheel_slip2:
  default_value: "0.0005"
  description: "Secondary slip compliance for wheel-ground contact."

# Xacro arguments defined by urdf/includes/fork_simple_module.xacro.
# These fields configure the fork module added by model_forklift.xacro.
fork_use_visual:
  default_value: "True"
  description: "Include visual element for the fork body."
  choices: ["True", "true", "False", "false"]
fork_use_collision:
  default_value: "True"
  description: "Include collision element for the fork body."
  choices: ["True", "true", "False", "false"]
fork_use_inertial:
  default_value: "False"
  description: "Use inertial element for the fork."
  choices: ["True", "true", "False", "false"]
fork_use_v_mesh:
  default_value: "True"
  description: "Use a mesh for the fork visual. If False, use a primitive."
  choices: ["True", "true", "False", "false"]
fork_color:
  default_value: "0.1 0.1 0.1 1.0"
  description: "Fork color as 'r g b a'."
fork_use_c_mesh:
  default_value: "True"
  description: "Use a mesh for the fork collision. If False, use a primitive."
  choices: ["True", "true", "False", "false"]
fork_limits:
  default_value: "-0.005 0.2 0.2 20000.0"
  description: "Fork prismatic joint limits as 'lower upper velocity effort'."
fork_rest_clearance:
  default_value: "0.01"
  description: "Rest clearance between the fork and the ground."
fork_tine_open:
  default_value: "False"
  description: "If True, tines are left open (no front closing plates). If False, front plates close the tine openings."
  choices: ["True", "true", "False", "false"]

fork_rgbd_use_visual:
  default_value: "True"
  description: "Include visual element for the RGBD camera mounted on the fork."
  choices: ["True", "true", "False", "false"]
fork_rgbd_use_collision:
  default_value: "True"
  description: "Include collision element for the RGBD camera mounted on the fork."
  choices: ["True", "true", "False", "false"]
fork_rgbd_use_inertial:
  default_value: "True"
  description: "Include inertial element for the RGBD camera mounted on the fork."
  choices: ["True", "true", "False", "false"]
fork_rgbd_use_v_mesh:
  default_value: "True"
  description: "Use a mesh for the fork RGBD visual. If False, use a primitive."
  choices: ["True", "true", "False", "false"]
fork_rgbd_color:
  default_value: "0.5 0.5 0.5 1.0"
  description: "Optional fork RGBD color override 'r g b a'. Empty keeps mesh color."
fork_rgbd_use_c_mesh:
  default_value: "False"
  description: "Use a mesh for the fork RGBD collision. If False, use a primitive."
  choices: ["True", "true", "False", "false"]

back_top_lidar_use_visual:
  default_value: "True"
  description: "Include visual element for the back top lidar body."
