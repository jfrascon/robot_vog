# All xarg values in this file are stored as strings.
# This includes numbers, booleans and any other scalar values.
fork_use_inertial:
  default_value: "False"
  description: "Use inertial element for the fork."
  choices: ["True", "true", "False", "false"]
fork_color:
  default_value: "0.1 0.1 0.1 1.0"
  description: "Fork color as 'r g b a'."
fork_limits:
  default_value: "-0.01 0.8 0.5 20000.0"
  description: "Fork prismatic joint limits as 'lower upper velocity effort'."
fork_tines_rest_clearance:
  default_value: "0.03"
  description: "Rest clearance between the fork tines and the ground."
fork_rgbd_use_visual:
  default_value: "True"
  description: "Include visual element for the RGBD camera mounted on the fork."
  choices: ["True", "true", "False", "false"]
fork_rgbd_use_collision:
  default_value: "True"
  description: "Include collision element for the RGBD camera mounted on the fork."
  choices: ["True", "true", "False", "false"]
fork_rgbd_use_inertial:
  default_value: "True"
  description: "Include inertial element for the RGBD camera mounted on the fork."
  choices: ["True", "true", "False", "false"]
fork_rgbd_use_v_mesh:
  default_value: "True"
  description: "Use a mesh for the fork RGBD visual. If False, use a primitive."
  choices: ["True", "true", "False", "false"]
fork_rgbd_color:
  default_value: "0.5 0.5 0.5 1.0"
  description: "Optional fork RGBD color override 'r g b a'. Empty keeps mesh color."
fork_rgbd_use_c_mesh:
  default_value: "False"
  description: "Use a mesh for the fork RGBD collision. If False, use a primitive."
  choices: ["True", "true", "False", "false"]
