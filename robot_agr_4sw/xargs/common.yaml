# All xarg values in this file are stored as strings.
# This includes numbers, booleans and any other scalar values.
sim_file:
  default_value: ""
  description: "Path to the simulation YAML. If empty, the model default is used."
body_mesh:
  default_value: ""
  description: "Body mesh path within package format <pkg>/<path>."
body_mesh_scale:
  default_value: "1.0 1.0 1.0"
  description: "Body mesh scale as 'sx sy sz'."
body_color:
  default_value: "0.5 0.5 0.5 1.0"
  description: "Body color as 'r g b a'."
body_size:
  default_value: "1.044 0.650 0.34"
  description: "Body size as 'x y z' in meters."
body_use_inertial:
  default_value: "True"
  description: "Use inertial element for the body. If False, a null inertia is used."
  choices: ["True", "true", "False", "false"]
body_mass:
  default_value: "25"
  description: "Body mass in kilograms when body inertia is enabled."
use_bottom_belly:
  default_value: "True"
  description: "Add the optional lower belly / ballast box."
  choices: ["True", "true", "False", "false"]
belly_mass:
  default_value: "45"
  description: "Belly mass in kilograms when the belly is enabled."
belly_size:
  default_value: "0.483037 0.420000 0.105000"
  description: "Belly size as 'x y z' in meters."
ground_clearance:
  default_value: "0.191"
  description: "Distance from the footprint frame to the body bottom face, excluding the belly."
dist_to_wheels:
  default_value: "0.4366337137693332"
  description: "Distance from the body origin to each wheel center in the XY plane."
alpha_deg:
  default_value: "32.56180140948635"
  description: "Wheel layout angle in degrees."
s_wheel_mesh:
  default_value: "robotics_description/meshes/wheels/standard_wheels/rubber_wheel_2.stl"
  description: "Wheel visual mesh path within package format <pkg>/<path>."
s_wheel_mesh_scale:
  default_value: "1.0 1.0 1.0"
  description: "Wheel mesh scale as 'sx sy sz'."
s_wheel_color:
  default_value: "0.5 0.5 0.5 1.0"
  description: "Wheel color as 'r g b a'. Empty keeps mesh color."
s_wheel_radius:
  default_value: "0.1175"
  description: "Steerable wheel radius in meters."
s_wheel_thickness:
  default_value: "0.142462"
  description: "Steerable wheel thickness in meters."
s_wheel_use_inertial:
  default_value: "True"
  description: "Use inertial element for wheels. If False, a null inertia is used."
  choices: ["True", "true", "False", "false"]
s_wheel_mass:
  default_value: "7.5"
  description: "Steerable wheel mass in kilograms."
s_wheel_steering_joint_limits:
  default_value: "-3.1416 3.1416 100.0 100000.0"
  description: "Steering joint limits as 'lower upper velocity effort'."
s_wheel_rotation_joint_limits:
  default_value: "100.0 100000.0"
  description: "Wheel rotation joint limits as 'velocity effort'."
s_wheel_max_contacts:
  default_value: "1"
  description: "Maximum number of contact points for each wheel."
s_wheel_mu:
  default_value: "0.05"
  description: "Primary friction coefficient for wheel-ground contact."
s_wheel_mu2:
  default_value: "0.5"
  description: "Secondary friction coefficient for wheel-ground contact."
s_wheel_slip1:
  default_value: "0.005"
  description: "Primary slip compliance for wheel-ground contact."
s_wheel_slip2:
  default_value: "0.0005"
  description: "Secondary slip compliance for wheel-ground contact."
